<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI CV Matcher | UK Job Market</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root { --primary: #4f46e5; --bg: #f9fafb; --text: #111827; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); margin: 0; padding: 20px; display: flex; justify-content: center; color: var(--text); }
        .container { background: white; padding: 2rem; border-radius: 16px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); max-width: 600px; width: 100%; }
        
        h1 { text-align: center; margin-bottom: 0.5rem; }
        .subtitle { text-align: center; color: #6b7280; font-size: 0.9rem; margin-bottom: 2rem; }
        
        .input-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 600; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
        
        button { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: background 0.3s; }
        button:hover { background: #4338ca; }
        button:disabled { background: #9ca3af; cursor: not-allowed; }

        /* 2. Progress Bar Styles */
        #result-container { margin-top: 2rem; display: none; border-top: 2px solid #f3f4f6; padding-top: 1.5rem; }
        .score-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
        #match-label { font-weight: bold; font-size: 1.1rem; }
        .progress-bg { background: #e5e7eb; border-radius: 999px; height: 16px; width: 100%; overflow: hidden; margin-bottom: 1.5rem; }
        .progress-fill { background: var(--primary); height: 100%; width: 0%; transition: width 1s ease-in-out; }

        /* 3. Clean Content Styles (Removing awful formatting) */
        #analysis-content h3 { font-size: 1.2rem; margin-top: 1.5rem; color: var(--primary); border-bottom: 1px solid #e5e7eb; padding-bottom: 4px; }
        #analysis-content ul { padding-left: 1.5rem; line-height: 1.6; }
        #analysis-content li { margin-bottom: 10px; }
        #analysis-content strong { color: #1f2937; }

        .loading { text-align: center; color: #6b7280; display: none; margin-top: 1rem; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <h1>🤖 AI CV Matcher</h1>
    <p class="subtitle">Optimized for the UK Job Market (Gemini 3.1 Powered)</p>

    <div class="input-group">
        <label for="cvFile">Upload CV (PDF)</label>
        <input type="file" id="cvFile" accept=".pdf">
    </div>

    <div class="input-group">
        <label for="jobDesc">Job Description</label>
        <textarea id="jobDesc" rows="6" placeholder="Paste the job requirements here..."></textarea>
    </div>

    <button id="analyzeBtn" onclick="runAnalysis()">Analyze My Match</button>
    <div id="loader" class="loading">Recruiter AI is scanning your profile...</div>

    <div id="result-container">
        <div class="score-header">
            <span id="match-label">Match Percentage</span>
            <span id="match-number" style="font-weight: bold; color: var(--primary);">0%</span>
        </div>
        <div class="progress-bg">
            <div id="progressBar" class="progress-fill"></div>
        </div>
        <div id="analysis-content"></div>
    </div>
</div>

<script>
    async function runAnalysis() {
        const fileInput = document.getElementById('cvFile');
        const jobDesc = document.getElementById('jobDesc').value;
        const btn = document.getElementById('analyzeBtn');
        const loader = document.getElementById('loader');
        const resultContainer = document.getElementById('result-container');
        const analysisContent = document.getElementById('analysis-content');
        const progressBar = document.getElementById('progressBar');
        const matchNumber = document.getElementById('match-number');

        if (!fileInput.files[0] || !jobDesc.trim()) {
            alert("Please provide both a CV and a Job Description.");
            return;
        }

        // Reset UI
        btn.disabled = true;
        loader.style.display = 'block';
        resultContainer.style.display = 'none';
        progressBar.style.width = '0%';

        const formData = new FormData();
        formData.append('file', fileInput.files[0]);
        formData.append('job_description', jobDesc);

        try {
            const response = await fetch('https://ai-cv-analyzer-7qqa.onrender.com/analyze', {
                method: 'POST',
                body: formData
            });

            if (!response.ok) throw new Error("Connection failed. Check Render logs.");

            const data = await response.json();

            // 1. Clean the text using Marked.js (Removes # and *)
            analysisContent.innerHTML = marked.parse(data.analysis);

            // 2. Extract Percentage from text (e.g., "75%")
            const percentageMatch = data.analysis.match(/(\d+)%/);
            const score = percentageMatch ? parseInt(percentageMatch[1]) : 0;

            // 3. Show Results and Animate Bar
            loader.style.display = 'none';
            resultContainer.style.display = 'block';
            
            setTimeout(() => {
                progressBar.style.width = score + '%';
                matchNumber.innerText = score + '%';
            }, 100);

        } catch (error) {
            alert("Error: " + error.message);
            loader.style.display = 'none';
        } finally {
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
