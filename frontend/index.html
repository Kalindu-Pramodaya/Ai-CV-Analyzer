<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI CV Matcher | UK Job Market</title>
    <style>
        :root { --primary: #4f46e5; --bg: #f9fafb; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); max-width: 500px; width: 100%; }
        h1 { font-size: 1.5rem; text-align: center; color: #111827; }
        .input-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.875rem; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #result { margin-top: 1.5rem; padding: 1rem; border-radius: 6px; background: #f3f4f6; font-size: 0.875rem; white-space: pre-wrap; display: none; }
        .loader { text-align: center; display: none; margin-top: 10px; font-size: 0.875rem; color: #6b7280; }
    </style>
</head>
<body>

<div class="container">
    <h1>🤖 AI CV Matcher</h1>
    <p style="text-align: center; color: #6b7280; font-size: 0.8rem; margin-bottom: 2rem;">Optimized for the UK Job Market</p>

    <div class="input-group">
        <label>Upload CV (PDF)</label>
        <input type="file" id="cvFile" accept=".pdf">
    </div>

    <div class="input-group">
        <label>Job Description</label>
        <textarea id="jobDesc" rows="5" placeholder="Paste the job requirements here..."></textarea>
    </div>

    <button id="analyzeBtn" onclick="analyzeCV()">Analyze My Match</button>
    
    <div id="loader" class="loader">Gemini is researching your profile...</div>
    <div id="result"></div>
</div>

<script>
    async function analyzeCV() {
        const fileInput = document.getElementById('cvFile');
        const jobDesc = document.getElementById('jobDesc').value;
        const btn = document.getElementById('analyzeBtn');
        const resultDiv = document.getElementById('result');
        const loader = document.getElementById('loader');

        if (!fileInput.files[0] || !jobDesc) {
            alert("Please upload a CV and paste a Job Description.");
            return;
        }

        // UI Updates
        btn.disabled = true;
        loader.style.display = 'block';
        resultDiv.style.display = 'none';

        const formData = new FormData();
        formData.append('file', fileInput.files[0]);
        formData.append('job_description', jobDesc);

        try {
            // UPDATED: Points to your Render URL
            const response = await fetch('https://ai-cv-analyzer-7qqa.onrender.com/analyze', {
                method: 'POST',
                body: formData
            });

            if (!response.ok) throw new Error('Server error or missing python-multipart');

            const data = await response.json();
            resultDiv.innerText = data.analysis;
            resultDiv.style.display = 'block';
        } catch (error) {
            alert("Error: " + error.message);
        } finally {
            btn.disabled = false;
            loader.style.display = 'none';
        }
    }
</script>

</body>
</html>
