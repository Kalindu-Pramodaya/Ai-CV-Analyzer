<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI CV Matcher | UK Tech Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .loader { border-top-color: #3b82f6; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen py-12 px-4">
    <div class="max-w-4xl mx-auto">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-extrabold text-slate-900 mb-2">
                <i class="fa-solid fa-robot text-blue-600 mr-2"></i>AI CV Matcher
            </h1>
            <p class="text-slate-600">Optimized for the UK Job Market (Gemini Powered)</p>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 mb-8">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2 uppercase tracking-wider">
                        <i class="fa-solid fa-file-pdf mr-2"></i>Upload CV
                    </label>
                    <input type="file" id="cvFile" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 transition-all cursor-pointer"/>
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2 uppercase tracking-wider">
                        <i class="fa-solid fa-briefcase mr-2"></i>Job Description
                    </label>
                    <textarea id="jobDesc" rows="4" class="w-full rounded-xl border-slate-200 border p-3 focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm" placeholder="Paste the job description here..."></textarea>
                </div>
            </div>
            
            <button onclick="analyze()" id="btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl transition-all flex items-center justify-center gap-2 shadow-lg shadow-blue-200">
                <span>Analyze My Match</span>
            </button>
        </div>

        <div id="loading" class="hidden text-center p-12">
            <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-12 w-12 mb-4 mx-auto"></div>
            <p class="text-slate-500 font-medium">Gemini is researching your profile...</p>
        </div>

        <div id="resultBox" class="hidden space-y-6">
            <div class="bg-white p-8 rounded-2xl shadow-sm border-l-8 border-blue-600 border border-slate-200">
                <div class="flex items-center justify-between">
                    <div>
                        <h2 class="text-2xl font-bold text-slate-800">Match Analysis</h2>
                        <p id="scoreText" class="text-slate-500 mt-1"></p>
                    </div>
                    <div class="text-4xl font-black text-blue-600 bg-blue-50 p-4 rounded-full" id="percentCircle">--%</div>
                </div>
            </div>

            <div id="analysisContent" class="grid grid-cols-1 gap-6">
                </div>
        </div>
    </div>

    <script>
        async function analyze() {
            const fileInput = document.getElementById('cvFile');
            const jobDesc = document.getElementById('jobDesc').value;
            const btn = document.getElementById('btn');
            const resultBox = document.getElementById('resultBox');
            const loading = document.getElementById('loading');
            const analysisContent = document.getElementById('analysisContent');

            if (!fileInput.files[0] || !jobDesc) {
                alert("Please upload your CV and paste the job details!");
                return;
            }

            // UI Reset
            loading.classList.remove('hidden');
            resultBox.classList.add('hidden');
            btn.disabled = true;
            btn.classList.add('opacity-50');

            const formData = new FormData();
            formData.append('cv_file', fileInput.files[0]);
            formData.append('job_description', jobDesc);

            try {
                const response = await fetch('http://127.0.0.1:8000/analyze', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                if (data.status === "success") {
                    displayResults(data.analysis);
                } else {
                    alert("Error: " + data.message);
                }
            } catch (err) {
                alert("Could not connect to the Python server. Make sure uvicorn is running!");
            } finally {
                loading.classList.add('hidden');
                btn.disabled = false;
                btn.classList.remove('opacity-50');
            }
        }

        function displayResults(text) {
            const resultBox = document.getElementById('resultBox');
            const analysisContent = document.getElementById('analysisContent');
            const percentCircle = document.getElementById('percentCircle');
            
            // Extract percentage using regex (finds 85% etc)
            const match = text.match(/(\d+)%/);
            const percentage = match ? match[0] : "85%";
            percentCircle.innerText = percentage;

            // Simple "Cleaner" for the AI text to make it look like cards
            const sections = text.split('###');
            analysisContent.innerHTML = ''; // Clear previous

            sections.forEach(section => {
                if (section.trim().length < 10) return;
                
                const card = document.createElement('div');
                card.className = "bg-white p-6 rounded-2xl shadow-sm border border-slate-200 prose max-w-none";
                card.innerHTML = `
                    <div class="text-slate-700 whitespace-pre-line">${section.replace(/\*\*/g, '').trim()}</div>
                `;
                analysisContent.appendChild(card);
            });

            resultBox.classList.remove('hidden');
            resultBox.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
