<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI CV Matcher | UK Job Market</title>
    <style>
        :root { --primary: #4f46e5; --bg: #f9fafb; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; }
        .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h1 { color: #111827; font-size: 1.5rem; margin-bottom: 1rem; text-align: center; }
        .input-group { margin-bottom: 1.5rem; }
        label { display: block; font-weight: 600; margin-bottom: 0.5rem; color: #374151; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; background: var(--primary); color: white; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 1rem; }
        button:disabled { background: #9ca3af; }
        #result { margin-top: 1.5rem; padding: 1rem; border-radius: 6px; background: #f3f4f6; display: none; white-space: pre-wrap; }
        .loader { text-align: center; display: none; color: var(--primary); margin-top: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h1>🤖 AI CV Matcher</h1>
    <p style="text-align: center; color: #6b7280; margin-top: -10px;">Optimized for UK Job Market</p>

    <div class="input-group">
        <label>Upload CV (PDF)</label>
        <input type="file" id="cvFile" accept=".pdf">
    </div>

    <div class="input-group">
        <label>Job Description</label>
        <textarea id="jobDesc" rows="5" placeholder="Paste the job requirements here..."></textarea>
    </div>

    <button id="analyzeBtn" onclick="analyzeMatch()">Analyze My Match</button>
    
    <div id="loader" class="loader">Gemini is researching your profile...</div>
    <div id="result"></div>
</div>

<script>
    async function analyzeMatch() {
        const fileInput = document.getElementById('cvFile');
        const jobDesc = document.getElementById('jobDesc').value;
        const resultDiv = document.getElementById('result');
        const loader = document.getElementById('loader');
        const btn = document.getElementById('analyzeBtn');

        if (!fileInput.files[0] || !jobDesc) {
            alert("Please provide both a CV and a Job Description.");
            return;
        }

        const formData = new FormData();
        formData.append('file', fileInput.files[0]);
        formData.append('job_description', jobDesc);

        // UI State
        btn.disabled = true;
        loader.style.display = 'block';
        resultDiv.style.display = 'none';

        try {
            // UPDATED URL: Using your new Render service name
            const response = await fetch('https://uk-cv-ai-analyzer.onrender.com/analyze', {
                method: 'POST',
                body: formData
            });

            if (!response.ok) throw new Error('Server returned an error');

            const data = await response.json();
            resultDiv.innerText = data.analysis;
            resultDiv.style.display = 'block';
        } catch (error) {
            alert("Error: " + error.message);
        } finally {
            btn.disabled = false;
            loader.style.display = 'none';
        }
    }
</script>

</body>
</html>
